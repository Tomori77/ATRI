services:
  atri:
    build: .
    image: atri-wechat:local
    restart: unless-stopped
    # nsjail ships inside the image and builds the sandbox's namespaces itself,
    # which requires CAP_SYS_ADMIN plus a usable mount namespace. Verified on a
    # real host: cap_add alone is not enough (AppArmor still blocks the mount
    # tree), so privileged is the only config that works without touching the
    # host. What the model can reach stays narrow: its own net/mount/pid/user
    # namespaces, no network route out, read-only system directories, and no
    # view of /app or /data.
    privileged: true
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '${ATRI_BIND:-127.0.0.1}:${ATRI_PORT:-3000}:3000'
    volumes:
      - atri-data:/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    stop_grace_period: 45s
volumes:
  atri-data:
